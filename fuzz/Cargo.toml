[package]
name = "datafusion-quack-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
datafusion = { version = "55.1", default-features = false }
datafusion-quack = { path = "../datafusion-quack", features = ["fuzzing"] }
tokio = { version = "1", features = ["rt"] }

[[bin]]
name = "dispatch"
path = "fuzz_targets/dispatch.rs"
test = false
doc = false
bench = false

# not part of the main workspace: cargo-fuzz builds it with nightly
[workspace]
