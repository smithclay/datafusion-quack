[workspace]
resolver = "2"
members = [
    "arrow-quack",
    "datafusion-quack-catalog",
    "datafusion-quack",
    "datafusion-quack-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/smithclay/datafusion-quack"
homepage = "https://github.com/smithclay/datafusion-quack"
authors = ["Clay Smith"]
keywords = ["datafusion", "duckdb", "quack", "sql", "server"]
categories = ["database"]

[workspace.dependencies]
arrow-quack = { version = "0.1.0", path = "arrow-quack" }
datafusion-quack = { version = "0.1.0", path = "datafusion-quack" }
datafusion-quack-catalog = { version = "0.1.0", path = "datafusion-quack-catalog" }

arrow = { version = "59.2", default-features = false }
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio"] }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
datafusion = { version = "55.1", default-features = false }
futures = "0.3"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
proptest = "1"
# The `server` feature isn't on crates.io yet, so this is a rev of the fork that adds it
# (docs/mvp-plan.md, decision 1). `version` is what a published crate will need.
quack_protocol = { version = "0.3", git = "https://github.com/smithclay/quack_protocol_rs", rev = "5c5f4f785c79d8a34beadfb172ae13f21dcdadb5", default-features = false, features = ["server"] }
rand = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "sync", "time", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
