[workspace]
resolver = "2"
members = [
    "arrow-quack",
    "datafusion-quack-catalog",
    "datafusion-quack",
    "datafusion-quack-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/smithclay/datafusion-quack"
homepage = "https://github.com/smithclay/datafusion-quack"
authors = ["Clay Smith"]
keywords = ["datafusion", "duckdb", "quack", "sql", "server"]
categories = ["database"]

[workspace.dependencies]
arrow-quack = { version = "0.1.0", path = "arrow-quack" }
datafusion-quack = { version = "0.1.0", path = "datafusion-quack" }
datafusion-quack-catalog = { version = "0.1.0", path = "datafusion-quack-catalog" }

arrow = { version = "59.2", default-features = false }
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio"] }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
datafusion = { version = "55.1", default-features = false }
futures = "0.3"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
proptest = "1"
# The server feature is not on crates.io yet; see docs/mvp-plan.md, decision 1.
quack_protocol = { path = "../../../../private/tmp/claude-501/-Users-clay-workspace-datafusion-quack/1124c835-2194-4f67-9961-6f9e82447944/scratchpad/qp", default-features = false, features = ["server"] }
rand = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
subtle = "2"
thiserror = "2"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "sync", "time", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
