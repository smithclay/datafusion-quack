[package]
name = "datafusion-quack"
description = "Serve a DataFusion SessionContext over DuckDB's Quack protocol"
readme = "../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# `fuzzing::Harness`, a request handler without HTTP, for the fuzz targets.
fuzzing = []
# Counters, gauges and histograms through the `metrics` facade (see the README).
metrics = ["dep:metrics"]

[dependencies]
arrow = { workspace = true }
arrow-quack = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
datafusion = { workspace = true, features = ["sql", "nested_expressions"] }
datafusion-quack-catalog = { workspace = true }
futures = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
metrics = { workspace = true, optional = true }
quack_protocol = { workspace = true }
rand = { workspace = true }
rustls = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
datafusion = { workspace = true, features = ["sql", "nested_expressions", "string_expressions", "unicode_expressions", "datetime_expressions", "math_expressions"] }
quack_protocol = { workspace = true, features = ["server"] }
tokio = { workspace = true, features = ["test-util"] }
reqwest = { version = "0.12", default-features = false }
proptest = { workspace = true }
metrics-util = { workspace = true }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
rustls = { workspace = true }
tokio-rustls = { workspace = true }

[lints]
workspace = true
