name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: [default, all-features]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-${{ matrix.features }}
      - name: clippy
        run: >-
          cargo clippy --workspace --all-targets --locked
          ${{ matrix.features == 'all-features' && '--all-features' || '' }}
          -- -D warnings

  test:
    name: test (${{ matrix.toolchain }}, ${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, nightly]
        features: [default, fuzzing]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.toolchain }}-${{ matrix.features }}
      - name: test
        run: >-
          cargo test --workspace --locked
          ${{ matrix.features == 'fuzzing' && '--features datafusion-quack/fuzzing' || '' }}

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - name: rust-version equals DataFusion's
        run: |
          ours="${{ steps.msrv.outputs.version }}"
          theirs=$(cargo metadata --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "datafusion") | .rust_version')
          echo "workspace rust-version $ours, datafusion rust-version $theirs"
          test "$ours" = "$theirs"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Until quack_protocol's `server` feature is on crates.io, a packaged manifest
      # can't resolve (it names the released 0.3, which lacks the feature), so this
      # checks what each crate would ship. Then: cargo package --workspace --locked.
      - run: cargo package --workspace --locked --list

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@v1

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: fuzz dispatch for 60 s
        working-directory: fuzz
        run: |
          mkdir -p corpus/dispatch && cp seeds/dispatch/* corpus/dispatch/
          cargo fuzz run dispatch -- -max_total_time=60 -rss_limit_mb=4096
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  integration:
    name: integration (G5)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            tests-integration/.cache/quack_protocol_rs
            tests-integration/.cache/datafusion-table-providers
      - name: DuckDB ATTACH, TPC-H differential, quack_protocol and provider suites
        run: tests-integration/run.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: integration-logs
          path: tests-integration/out
